
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shop — корзина</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="cart-page">

    <header class="shop-header">
        <h1>shop</h1>
        <nav aria-label="Основная навигация">
            <a href="catalog.html">КАТАЛОГ</a>
            <a href="catalog.html">ПОИСК</a>
            <a href="index.html">ГЛАВНАЯ</a>
            <a href="cart.html">КОРЗИНА</a>
            <a href="profile.html">ПРОФИЛЬ</a>
        </nav>
    </header>

    <main class="cart-main">

        <h2 class="cart-title">КОРЗИНА</h2>

        <div class="cart-layout">

            <section class="cart-products">

                <article class="cart-item">
                    <img src="images/serum.jpg" alt="Сыворотка для лица">

                    <div class="cart-item-info">
                        <h3>Сыворотка для лица</h3>
                        <p>SKIN 1004 MADAGASCAR CENTELLA</p>
                        <p class="cart-item-price">2 777 ₽</p>
                    </div>

                    <div class="cart-item-quantity">
                        <span>Количество: 1</span>
                    </div>
                </article>

                <article class="cart-item">
                    <img src="images/serum.jpg" alt="Сыворотка для лица">

                    <div class="cart-item-info">
                        <h3>Сыворотка для лица</h3>
                        <p>SKIN 1004 MADAGASCAR CENTELLA</p>
                        <p class="cart-item-price">2 777 ₽</p>
                    </div>

                    <div class="cart-item-quantity">
                        <span>Количество: 1</span>
                    </div>
                </article>

            </section>

            <aside class="cart-summary">
                <h3>ВАШ ЗАКАЗ</h3>

                <div class="cart-summary-row">
                    <span>Товары</span>
                    <span>5 554 ₽</span>
                </div>

                <div class="cart-summary-row">
                    <span>Доставка</span>
                    <span>Бесплатно</span>
                </div>

                <div class="cart-total">
                    <span>ИТОГО</span>
                    <span>5 554 ₽</span>
                </div>

                <button type="button" class="cart-checkout">
                    ОФОРМИТЬ ЗАКАЗ
                </button>
            </aside>

        </div>

    </main>

    <footer class="home-footer"></footer>

</body>
</html>
